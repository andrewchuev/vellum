name: Build and release

on:
  repository_dispatch:
    types: [gitlab-push]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # The app's Kotlin/Android source lives in a private GitLab repo, not here.
      # This repo only carries the presentation README, screenshots, and this
      # workflow -- checking out a private source elsewhere keeps it that way
      # while still building on GitHub's free runners for public repos.
      - name: Checkout source from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://oauth2:${GITLAB_TOKEN}@gitlab.com/andrew.chuev/vellum.git" source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android signing config
        working-directory: source
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      - name: Run unit tests
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      - name: Build signed release APK
        working-directory: source
        run: ./gradlew assembleRelease --console=plain -PciBuildNumber=${{ github.run_number }}

      - name: Locate build artifact and derive version
        id: build_info
        working-directory: source
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          VERSION=$(basename "$APK_PATH" | sed -E 's/Vellum-(v[0-9.]+-build[0-9]+)-release\.apk/\1/')
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.build_info.outputs.version }}" \
            "${{ steps.build_info.outputs.apk_path }}" \
            --repo andrewchuev/vellum \
            --title "Vellum ${{ steps.build_info.outputs.version }}" \
            --notes "Automated build from GitLab commit ${{ github.event.client_payload.sha || 'manual trigger' }}." \
            --latest
