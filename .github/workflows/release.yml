name: Build and release

on:
  repository_dispatch:
    types: [gitlab-push]
  workflow_dispatch:

permissions:
  contents: write # repo default is read-only; release creation needs write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # The app's Kotlin/Android source lives in a private GitLab repo, not here.
      # This repo only carries the presentation README, screenshots, and this
      # workflow -- checking out a private source elsewhere keeps it that way
      # while still building on GitHub's free runners for public repos.
      - name: Checkout source from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          git clone --depth 1 "https://oauth2:${GITLAB_TOKEN}@gitlab.com/andrew.chuev/vellum.git" source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android signing config
        working-directory: source
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

      # Runs the unit tests of both editions (testDebugUnitTest is an alias for testBasic... and testMlkit...).
      - name: Run unit tests
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain

      # versionCode must keep increasing across releases; earlier local builds already
      # reached the 30s, so the run number is offset to stay above them.
      # Two editions are built: "mlkit" (the main one, with on-device sentence translation)
      # and "basic" (the offline dictionary only, no closed-source dependencies).
      - name: Build signed release APKs
        working-directory: source
        run: ./gradlew assembleRelease --console=plain -PciBuildNumber=$((100 + ${{ github.run_number }}))

      - name: Locate build artifacts and derive version
        id: build_info
        working-directory: source
        run: |
          MLKIT_APK=$(find app/build/outputs/apk/mlkit/release -name '*.apk' | head -1)
          BASIC_APK=$(find app/build/outputs/apk/basic/release -name '*.apk' | head -1)
          if [ -z "$MLKIT_APK" ] || [ -z "$BASIC_APK" ]; then
            echo "Expected one release APK per edition, found: mlkit='$MLKIT_APK' basic='$BASIC_APK'" >&2
            exit 1
          fi
          VERSION=$(basename "$MLKIT_APK" | sed -E 's/Vellum-(v[0-9.]+-build[0-9]+)-mlkit-release\.apk/\1/')
          case "$VERSION" in
            v*-build*) ;;
            *) echo "Could not derive the version from $MLKIT_APK" >&2; exit 1 ;;
          esac
          echo "mlkit_apk=$MLKIT_APK" >> "$GITHUB_OUTPUT"
          echo "basic_apk=$BASIC_APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.client_payload.sha || 'manual trigger' }}
        run: |
          cat > notes.md <<EOF
          Automated build from GitLab commit ${SOURCE_SHA}.

          - **mlkit** (recommended): the offline dictionary plus on-device sentence translation with Google ML Kit. About 40 MB.
          - **basic**: the offline dictionary only, with no closed-source dependencies. About 11 MB.
          EOF
          gh release create "${{ steps.build_info.outputs.version }}" \
            "${{ steps.build_info.outputs.mlkit_apk }}" \
            "${{ steps.build_info.outputs.basic_apk }}" \
            --repo andrewchuev/vellum \
            --title "Vellum ${{ steps.build_info.outputs.version }}" \
            --notes-file notes.md \
            --latest
